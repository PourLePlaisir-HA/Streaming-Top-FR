name: Validate Streaming Top FR

on:
  push:
    branches:
      - dev-0.7.0
      - dev-0.7.1
      - dev-0.8.0
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python
        run: python -m compileall -q custom_components/streaming_top_fr

      - name: Guard historical Streaming engine
        run: |
          git fetch --depth=1 origin refs/tags/0.7.1:refs/tags/0.7.1
          python scripts/check_historical_engine.py

      - name: Validate JSON
        run: |
          python -m json.tool custom_components/streaming_top_fr/manifest.json >/dev/null
          python -m json.tool custom_components/streaming_top_fr/strings.json >/dev/null
          python -m json.tool custom_components/streaming_top_fr/translations/fr.json >/dev/null
          python -m json.tool custom_components/streaming_top_fr/translations/en.json >/dev/null

      - name: Validate JavaScript syntax
        run: node --check custom_components/streaming_top_fr/www/streaming-top-fr-card.js

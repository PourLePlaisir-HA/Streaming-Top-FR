name: Validate Streaming Top FR

on:
  push:
    branches:
      - dev-0.7.0
      - dev-0.7.1
      - dev-0.8.0
      - dev-0.8.1
      - dev-0.9.0
      - dev-0.9.1
      - dev-0.9.2
      - dev-1.0.1
      - dev-1.0.2
      - dev-1.0.3
      - dev-1.0.4
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python
        run: python -m compileall -q custom_components/streaming_top_fr

      - name: Guard historical Streaming engine
        run: |
          git fetch --depth=1 origin refs/tags/0.7.1:refs/tags/0.7.1
          python scripts/check_historical_engine.py

      - name: Guard stable Streaming Local engine
        run: |
          git fetch --depth=1 origin 1272a4a878d425f33591f7a69428759d0057ce88
          python scripts/check_local_engine_v081.py

      - name: Check Streaming Local episodic parser
        run: python scripts/check_local_episodic_parser.py

      - name: Check canonical watched identities
        run: python scripts/check_watch_identity.py

      - name: Check reversible canonical watch registry
        run: python scripts/check_watch_registry.py

      - name: Check Local VLC playback
        run: python scripts/check_local_playback.py

      - name: Check optional movie duration filter
        run: python scripts/check_duration_filter.py

      - name: Check optional Debug mode
        run: python scripts/check_debug_mode.py

      - name: Check local copy Debug hotfix
        run: python scripts/check_local_copy_debug_hotfix.py

      - name: Check brand assets
        run: python scripts/check_brand_assets.py

      - name: Check automatic Lovelace resource
        run: python scripts/check_lovelace_resource.py

      - name: Validate JSON
        run: |
          python -m json.tool custom_components/streaming_top_fr/manifest.json >/dev/null
          python -m json.tool custom_components/streaming_top_fr/strings.json >/dev/null
          python -m json.tool custom_components/streaming_top_fr/translations/fr.json >/dev/null
          python -m json.tool custom_components/streaming_top_fr/translations/en.json >/dev/null

      - name: Validate JavaScript syntax
        run: node --check custom_components/streaming_top_fr/www/streaming-top-fr-card.js

      - name: Check Streaming Local Family/watched views
        run: node scripts/check_local_views.js
